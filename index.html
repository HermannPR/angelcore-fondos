<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angelcore · fondos</title><style>
:root{--bg:#0b0d2a;--fg:#e8ebff;--mu:#9aa3d9;--ac:#c9d4ff;--bd:#2a2f6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 ui-monospace,Menlo,monospace}
header{padding:24px 16px 8px}h1{margin:0 0 4px;font-size:28px;letter-spacing:.02em}p{margin:0;color:var(--mu)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px}
.card{all:unset;cursor:pointer;position:relative;display:block}
.card img{width:100%;aspect-ratio:1920/1248;object-fit:cover;background:#000;border:1px solid var(--bd);border-radius:6px;display:block}
.card:focus-visible img,.card:hover img{border-color:var(--ac)}
.pl{position:absolute;left:50%;top:calc(50% - 14px);transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(11,13,42,.7);border:1px solid var(--ac);display:grid;place-items:center;font-size:20px;padding-left:4px}
.cap{display:block;padding:6px 2px;color:var(--mu)}.cap b{color:var(--ac);margin-right:4px}
#v{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}
#v.on{display:flex}
#v video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.bar{display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.nav,.acc{display:flex;align-items:center;gap:8px}.acc{justify-content:center}
.bar .t{flex:1;text-align:center;color:var(--mu)}.bar .t b{color:var(--ac);margin-right:4px}
.bar button,.bar a{font:inherit;color:var(--fg);background:#161a4a;border:1px solid var(--bd);border-radius:8px;padding:10px 14px;text-decoration:none;cursor:pointer}
.bar button.big{padding:12px 12px;font-size:16px;white-space:nowrap}
#x{position:absolute;top:12px;right:12px;font:inherit;font-size:20px;color:var(--fg);background:rgba(11,13,42,.75);border:1px solid var(--bd);border-radius:50%;width:44px;height:44px;cursor:pointer}
</style></head><body><header><h1>ANGELCORE · fondos</h1><p>38 loops de 12 s, 1920×1248, cierran solos. Toca uno para verlo; dentro usa ‹ y › (o desliza) para pasar al anterior o al siguiente.</p></header>

</main>
<div id="v" role="dialog" aria-label="Visor de fondos"><video id="vid" muted loop playsinline controls></video><button id="x" aria-label="Cerrar">✕</button>
<div class="bar"><div class="nav"><button class="big" id="prev" aria-label="Anterior">‹ anterior</button><span class="t" id="t"></span><button class="big" id="next" aria-label="Siguiente">siguiente ›</button></div><div class="acc"><a id="dl" download>descargar</a><button id="fs">pantalla completa</button></div></div></div>
<script>
const F=[["A", "Catedral pintada"], ["B", "Velas y lirios"], ["C", "Cielo abierto"], ["D", "Vitrales"], ["E", "Nocturno"], ["F", "Claustro"], ["G", "Estampita"], ["H", "Despertar"], ["I", "Iris infinito"], ["J", "Escalera"], ["K", "Ciudad flotante"], ["L", "Estatua"], ["M", "Emblema"], ["N", "Metal líquido"], ["O", "Tormenta de plumas"], ["P", "Ofanim"], ["Q", "Rosetón vivo"], ["R", "Sigilo vivo"], ["S", "Transmisión"], ["T", "Sello"], ["U", "Agua bendita"], ["V", "Retablo"], ["W", "Estampa holográfica"], ["X", "Ala"], ["Y", "Un día en el cielo"], ["Z", "Vela"], ["AA", "Plumario"], ["AB", "Pluma sola"], ["AC", "Lirios"], ["AD", "Nave sin fin"], ["AE", "Cenit"], ["AF", "Vigilia"], ["AG", "Abanico"], ["AH", "Inmersión"], ["AI", "Súper 8"], ["AJ", "Constelación"], ["AK", "Reloj"], ["AL", "Eclipse"]];
const v=document.getElementById("v"),vid=document.getElementById("vid"),t=document.getElementById("t"),dl=document.getElementById("dl");
let i=0;
function show(n){i=(n+F.length)%F.length;const[l,nm]=F[i];vid.poster="portadas/"+l+".jpg";vid.src="loops/loop-"+l+".mp4";dl.href=vid.src;t.innerHTML="<b>"+l+"</b> "+nm+"<br>"+(i+1)+" de "+F.length;vid.play().catch(()=>{});history.replaceState(null,"","#"+l)}
function open_(n){v.classList.add("on");document.body.style.overflow="hidden";show(n)}
function close_(){vid.pause();vid.removeAttribute("src");vid.load();v.classList.remove("on");document.body.style.overflow="";history.replaceState(null,"",location.pathname)}
document.querySelectorAll(".card").forEach(c=>c.onclick=()=>open_(+c.dataset.i));
document.getElementById("prev").onclick=()=>show(i-1);
document.getElementById("next").onclick=()=>show(i+1);
document.getElementById("x").onclick=close_;
document.getElementById("fs").onclick=()=>{const e=v;(e.requestFullscreen?e.requestFullscreen():vid.webkitEnterFullscreen&&vid.webkitEnterFullscreen())};
addEventListener("keydown",e=>{if(!v.classList.contains("on"))return;if(e.key=="ArrowRight")show(i+1);else if(e.key=="ArrowLeft")show(i-1);else if(e.key=="Escape")close_()});
let x0=null;vid.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
vid.addEventListener("touchend",e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(d<0?i+1:i-1);x0=null});
const h=location.hash.slice(1),k=F.findIndex(f=>f[0]==h);if(k>=0)open_(k);
</script></body></html>
